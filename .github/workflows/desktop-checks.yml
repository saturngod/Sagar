name: Desktop verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/desktop-checks.yml'

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      # PR builds use placeholder SagarNet settings; secrets stay in release.yml.
      - name: Use example SagarNet config
        shell: bash
        run: cp src-tauri/sagarnet.example.json src-tauri/sagarnet.json
      - run: bun run check
      - run: bun test tests/frontend
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Large-book import/export/reopen sweep
        run: cargo test --locked --test epub_import large_book_import_export_sweep -- --ignored --nocapture
        working-directory: src-tauri
      - name: Build installers without publishing
        run: bun tauri build -- --locked
      - name: Keep installers for native smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
