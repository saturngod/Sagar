[package]
name = "sagar"
version = "0.3.4"
description = "EPUB Translation Studio — offline manual EPUB translation"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sagar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fontdb = "0.24"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
roxmltree = "0.21.1"
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["v4"] }
chrono = "0.4.45"
base64 = "0.23.1"
quick-xml = "0.42.0"
unicode-segmentation = "1.12"
# Provider discovery and explicitly consented streaming translation requests.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "charset"] }

tokio = { version = "1", features = ["rt", "time"] }

tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
